<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay Controller for OBS - Names</title><style>
:root{--wine:#741D2B;--wine-hi:#9a3348;--wine-dark:#4d0d18;--cream:#E8E3D9;--beige:#D6C6B4;--overlay-font:"Segoe UI",Arial,sans-serif;--name-shadow:0 2px 0 rgba(255,255,255,.65),0 3px 8px rgba(0,0,0,.18)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}.stage{position:relative;width:1920px;height:250px}.lower{position:absolute;left:50%;bottom:20px;width:760px;height:205px;opacity:0;transform:translate(-50%,12px);transition:opacity .28s ease,transform .38s cubic-bezier(.2,.8,.2,1);pointer-events:none}.lower.show{opacity:1;transform:translate(-50%,0)}.name{position:absolute;left:0;top:0;width:100%;text-align:center;color:var(--wine);font-family:var(--overlay-font);font-weight:900;font-size:64px;line-height:.95;text-transform:uppercase;letter-spacing:-1px;text-shadow:var(--name-shadow);opacity:0;transform:translateY(8px);transition:opacity .25s ease .28s,transform .35s ease .28s}.show .name{opacity:1;transform:translateY(0)}.card{position:absolute;left:50%;bottom:0;width:700px;height:112px;transform:translateX(-50%) scaleX(.04);transform-origin:center;background:linear-gradient(180deg,var(--wine-hi),var(--wine) 42%,var(--wine-dark));border:1px solid rgba(255,220,225,.55);border-radius:12px;box-shadow:0 5px 12px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.25) inset,0 -6px 12px rgba(25,0,5,.2) inset;overflow:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1) .06s}.show .card{transform:translateX(-50%) scaleX(1)}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 35%,rgba(255,255,255,0) 42%,rgba(255,255,255,.17) 50%,rgba(255,255,255,0) 58%,transparent 65%);transform:translateX(-45%);animation:shine 8s ease-in-out infinite}@keyframes shine{0%,12%{transform:translateX(-45%);opacity:0}20%{opacity:.7}42%{transform:translateX(45%);opacity:.7}50%,100%{transform:translateX(45%);opacity:0}}.role,.social{position:relative;z-index:2;text-align:center;color:#fff;opacity:0;transition:opacity .22s ease .38s}.show .role,.show .social{opacity:1}.role{padding-top:12px;font-family:var(--overlay-font);font-size:34px;line-height:1;font-weight:900;text-transform:uppercase;text-shadow:0 2px 3px rgba(0,0,0,.45)}.social{margin-top:7px;font-family:var(--overlay-font);font-size:29px;line-height:1;font-weight:800;text-transform:uppercase;color:#fff7ef;display:flex;align-items:center;justify-content:center;gap:8px}.instagram-icon{width:29px;height:29px;color:#fff7ef;flex:0 0 auto}.accent{position:absolute;top:10px;bottom:10px;width:5px;border-radius:99px;background:linear-gradient(#fff,var(--cream),var(--beige));box-shadow:0 0 7px rgba(232,227,217,.75)}.accent.left{left:10px}.accent.right{right:10px}
</style></head><body><div class="stage"><div id="lower" class="lower"><div id="name" class="name"></div><div class="card"><div class="accent left"></div><div class="accent right"></div><div id="role" class="role"></div><div id="social" class="social"><svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.2" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="4.25" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="17.65" cy="6.45" r="1.25" fill="currentColor"/></svg><span id="instagram"></span></div></div></div></div><script>
const lower=document.getElementById('lower'),nameEl=document.getElementById('name'),roleEl=document.getElementById('role'),igEl=document.getElementById('instagram'),social=document.getElementById('social');let timer=null,finishTimer=null;
function hide(){clearTimeout(timer);clearTimeout(finishTimer);lower.classList.remove('show')}
function show(data){clearTimeout(timer);clearTimeout(finishTimer);lower.classList.remove('show');const s=data._settings||{};document.documentElement.style.setProperty('--wine',s.primary||'#741D2B');document.documentElement.style.setProperty('--wine-hi',shade(s.primary||'#741D2B',24));document.documentElement.style.setProperty('--wine-dark',shade(s.primary||'#741D2B',-34));document.documentElement.style.setProperty('--beige',s.secondary||'#D6C6B4');document.documentElement.style.setProperty('--cream',shade(s.secondary||'#D6C6B4',22));document.documentElement.style.setProperty('--overlay-font',s.font||'"Segoe UI",Arial,sans-serif');document.documentElement.style.setProperty('--name-shadow',s.nameShadow===false?'none':'0 2px 0 rgba(255,255,255,.65),0 3px 8px rgba(0,0,0,.18)');const width=Math.max(420,Math.min(1200,Number(s.nameWidth)||700));document.querySelector('.card').style.width=width+'px';lower.style.width=(width+60)+'px';lower.style.left=s.namePosition==='left'?'5%':s.namePosition==='right'?'95%':'50%';lower.style.transform=s.namePosition==='left'?'translate(0,12px)':s.namePosition==='right'?'translate(-100%,12px)':'translate(-50%,12px)';nameEl.textContent=(data.name||'').toUpperCase();roleEl.textContent=(data.role||'').toUpperCase();igEl.textContent=(data.instagram||'').replace(/^@/,'').toUpperCase();social.style.display=data.instagram?'flex':'none';void lower.offsetWidth;lower.classList.add('show');if(s.namePosition==='left')lower.style.transform='translate(0,0)';else if(s.namePosition==='right')lower.style.transform='translate(-100%,0)';else lower.style.transform='translate(-50%,0)';timer=setTimeout(()=>hide(),(Number(s.duration)||30)*1000)}function shade(hex,amt){let c=(hex||'#741D2B').replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let n=parseInt(c,16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
window.addEventListener('oocLowerThirdShow',e=>show(e.detail||{}));window.addEventListener('oocLowerThirdHide',()=>hide());
</script></body></html>
