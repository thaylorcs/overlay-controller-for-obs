<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Overlay Controller for OBS</title>
    <style>
      :root {
        --bg: #181a1f;
        --panel: #20232a;
        --panel2: #262a32;
        --line: #343842;
        --text: #e8eaed;
        --muted: #9ba1ab;
        --accent: #741d2b;
        --play: #ff7b2c;
        --stop: #8b9099;
        --ok: #55b66f;
        --danger: #d76572;
      }
      * {
        box-sizing: border-box;
      }
      /* OBS-style scrollbar: compact, dark, neutral and unobtrusive. */
      html {
        scrollbar-color: #5b6069 #20232a;
        scrollbar-width: thin;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #20232a;
      }
      ::-webkit-scrollbar-thumb {
        background: #5b6069;
        border: 2px solid #20232a;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #737984;
      }
      ::-webkit-scrollbar-thumb:active {
        background: #858b96;
      }
      ::-webkit-scrollbar-corner {
        background: #20232a;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          13px 'Segoe UI',
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .app {
        padding: 9px 11px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
      }
      .head strong {
        font-size: 13px;
      }
      .conn {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #6d727c;
      }
      .dot.ok {
        background: var(--ok);
        box-shadow: 0 0 6px #55b66f88;
      }
      .dot.bad {
        background: var(--danger);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        margin-bottom: 9px;
      }
      .tab {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--muted);
        height: 34px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        color: #fff;
        border-bottom-color: var(--accent);
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 5px 0 8px;
      }
      .toolbar span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.55px;
        color: #b9bec7;
        font-weight: 700;
      }
      .iconbtn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: #cfd3da;
        border-radius: 4px;
        height: 27px;
        min-width: 27px;
        cursor: pointer;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .row {
        display: grid;
        grid-template-columns: 34px 1fr 30px;
        align-items: center;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--panel);
        overflow: hidden;
      }
      .row.onair,
      .socialCard.onair {
        border-color: var(--accent);
        box-shadow: inset 3px 0 var(--accent);
      }
      .trigger,
      .socialTrigger {
        height: 100%;
        border: 0;
        border-right: 1px solid var(--line);
        background: transparent;
        color: var(--play);
        font-size: 18px;
        cursor: pointer;
      }
      .row.onair .trigger,
      .socialCard.onair .socialTrigger {
        color: var(--stop);
      }
      .meta {
        padding: 6px 9px;
        min-width: 0;
        cursor: pointer;
      }
      .name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sub,
      .network {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .edit {
        border: 0;
        background: transparent;
        color: #aeb3bc;
        cursor: pointer;
        font-size: 15px;
      }
      .status {
        margin-top: 8px;
        min-height: 16px;
        color: var(--muted);
        font-size: 11px;
      }
      .status.err {
        color: #e57f8a;
      }
      .editor {
        display: none;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .editor.open {
        display: block;
      }
      .field {
        margin-bottom: 8px;
      }
      .field label {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .field input,
      .field select {
        width: 100%;
        height: 29px;
        background: #111318;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 8px;
        outline: none;
      }
      .editorActions {
        display: flex;
        gap: 6px;
      }
      .editorActions button,
      .widebtn {
        height: 30px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: #303540;
        color: #fff;
        cursor: pointer;
        flex: 1;
      }
      .editorActions .save,
      .primary {
        background: var(--accent) !important;
      }
      .socialCard {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 5px;
        overflow: hidden;
      }
      .socialTop {
        display: grid;
        grid-template-columns: 42px 1fr 36px;
        min-height: 50px;
        align-items: center;
      }
      .socialLines {
        padding: 7px 10px;
      }
      .settingsSection {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 8px;
      }
      .settingsSection h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #c1c5cc;
        margin: 0 0 9px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .colorline {
        display: grid;
        grid-template-columns: 1fr 48px;
        gap: 6px;
      }
      .colorline input[type='color'] {
        padding: 2px;
      }
      .buttons {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .buttons button {
        flex: 1;
      }
      .hint {
        color: #7f8691;
        font-size: 10px;
        line-height: 1.4;
        margin-top: 6px;
      }
      .fileInput {
        display: none;
      }

      html,
      body {
        min-width: 360px;
      }
      .app {
        min-width: 340px;
      }
      .head strong {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .head {
        gap: 8px;
      }
      .conn {
        flex: 0 0 auto;
      }
      .compactTitle {
        display: none;
      }
      @media (max-width: 390px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
        .colorline {
          grid-template-columns: minmax(0, 1fr) 48px;
        }
        .fullTitle {
          display: none;
        }
        .compactTitle {
          display: inline;
        }
        .app {
          padding: 8px;
        }
        .settingsSection {
          padding: 9px;
        }
        .tabs .tab {
          font-size: 12px;
        }
      }
      .overlayPreview {
        overflow: hidden;
        background-color: #464950;
        background-image: conic-gradient(
          #60646c 25%,
          transparent 0 50%,
          #60646c 0 75%,
          transparent 0
        );
        background-size: 20px 20px;
        border-radius: 5px;
      }
      .overlayPreview iframe {
        display: block;
        width: 1920px;
        height: 250px;
        border: 0;
        transform-origin: top left;
        pointer-events: none;
      }
      input[type='color'] {
        min-height: 29px;
      }
      input[type='file'] {
        height: auto !important;
        padding: 6px !important;
      }
      .hint {
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
      }
      .settingsSection.settingsModule {
        padding: 0;
      }
      .settingsModule > h3 {
        margin: 0;
      }
      .moduleToggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 12px 10px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--text);
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        text-align: left;
        cursor: pointer;
      }
      .moduleToggle:after {
        content: '›';
        font-size: 20px;
        line-height: 16px;
        color: var(--muted);
        transform: rotate(0deg);
      }
      .moduleToggle[aria-expanded='true']:after {
        transform: rotate(90deg);
      }
      .moduleToggle:hover {
        background: var(--panel2);
      }
      .moduleBody {
        padding: 10px;
        border-top: 1px solid var(--line);
      }
      .moduleActions {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      #saveSettings {
        position: sticky;
        bottom: 8px;
        width: 100%;
        z-index: 5;
        box-shadow: 0 0 0 5px var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="head">
        <strong
          ><span class="fullTitle">Overlay Controller for OBS</span
          ><span class="compactTitle">Overlay Controller</span></strong
        >
        <div class="conn"><span id="dot" class="dot"></span><span id="connText"></span></div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="names" data-i18n="tabNames"></button
        ><button class="tab" data-tab="social" data-i18n="tabSocial"></button
        ><button class="tab" data-tab="settings" title="Settings">⚙</button>
      </div>
      <div id="names" class="view active">
        <div class="toolbar">
          <span data-i18n="people"></span><button id="add" class="iconbtn">＋</button>
        </div>
        <div id="list" class="list"></div>
        <div id="editor" class="editor">
          <div class="field"><label data-i18n="name"></label><input id="personName" /></div>
          <div class="field"><label data-i18n="role"></label><input id="personRole" /></div>
          <div class="field">
            <label data-i18n="instagramOptional"></label><input id="instagramPessoa" />
          </div>
          <div class="editorActions">
            <button id="save" class="save" data-i18n="save"></button
            ><button id="cancel" data-i18n="cancel"></button
            ><button id="delete" data-i18n="delete"></button>
          </div>
        </div>
      </div>
      <div id="social" class="view">
        <div class="toolbar"><span data-i18n="socialNetworks"></span></div>
        <div id="socialCard" class="socialCard">
          <div class="socialTop">
            <button id="socialTrigger" class="socialTrigger">▶</button>
            <div class="socialLines">
              <div class="name" data-i18n="showSocial"></div>
              <div id="ytPreview" class="network"></div>
              <div id="fbPreview" class="network"></div>
              <div id="igPreview" class="network"></div>
            </div>
            <button id="socialEdit" class="edit">✎</button>
          </div>
        </div>
        <div id="socialEditor" class="editor">
          <div class="field"><label>YOUTUBE</label><input id="youtube" /></div>
          <div class="field"><label>FACEBOOK</label><input id="facebook" /></div>
          <div class="field"><label>INSTAGRAM</label><input id="instagramSocial" /></div>
          <div class="editorActions">
            <button id="saveSocial" class="save" data-i18n="save"></button
            ><button id="cancelSocial" data-i18n="cancel"></button>
          </div>
        </div>
      </div>
      <div id="settings" class="view">
        <div class="settingsSection">
          <h3 data-i18n="general"></h3>
          <div class="grid2">
            <div class="field">
              <label data-i18n="language"></label
              ><select id="language">
                <option value="auto">Auto</option>
                <option value="en">English</option>
                <option value="pt-BR">Português (Brasil)</option>
              </select>
            </div>
            <div class="field">
              <label data-i18n="duration"></label
              ><input id="duration" type="number" min="3" max="300" />
            </div>
          </div>
          <div class="field">
            <label data-i18n="font"></label
            ><select id="font">
              <option value='"Segoe UI",Arial,sans-serif'>Segoe UI</option>
              <option value="Arial,sans-serif">Arial</option>
              <option value='"Arial Black",Impact,sans-serif'>Arial Black</option>
              <option value='Impact,"Arial Narrow",sans-serif'>Impact</option>
              <option value='"Trebuchet MS",Arial,sans-serif'>Trebuchet MS</option>
              <option value="Verdana,Arial,sans-serif">Verdana</option>
              <option value='Georgia,"Times New Roman",serif'>Georgia</option>
            </select>
          </div>
        </div>
        <div class="settingsSection">
          <h3 data-i18n="nameLowerThird"></h3>
          <div class="grid2">
            <div class="field">
              <label data-i18n="primaryColor"></label>
              <div class="colorline">
                <input id="primaryColor" type="text" /><input
                  id="primaryColorPicker"
                  type="color"
                />
              </div>
            </div>
            <div class="field">
              <label data-i18n="secondaryColor"></label>
              <div class="colorline">
                <input id="secondaryColor" type="text" /><input
                  id="secondaryColorPicker"
                  type="color"
                />
              </div>
            </div>
          </div>
          <div class="grid2">
            <div class="field">
              <label data-i18n="width"></label
              ><input id="nameWidth" type="number" min="420" max="1200" />
            </div>
            <div class="field">
              <label data-i18n="position"></label
              ><select id="namePosition">
                <option value="center" data-i18n="center"></option>
                <option value="left" data-i18n="left"></option>
                <option value="right" data-i18n="right"></option>
              </select>
            </div>
          </div>
          <div class="field">
            <label
              style="
                display: flex;
                align-items: center;
                gap: 7px;
                font-size: 11px;
                color: var(--text);
                cursor: pointer;
              "
              ><input id="nameShadow" type="checkbox" style="width: auto; height: auto" /><span
                data-i18n="nameShadow"
              ></span
            ></label>
          </div>
        </div>
        <div class="settingsSection">
          <h3>OBS WebSocket</h3>
          <div class="grid2">
            <div class="field"><label data-i18n="server"></label><input id="host" /></div>
            <div class="field"><label data-i18n="port"></label><input id="port" /></div>
          </div>
          <div class="hint" data-i18n="wsHint"></div>
          <button
            id="reconnect"
            class="widebtn"
            style="margin-top: 8px"
            data-i18n="reconnect"
          ></button>
        </div>
        <div class="settingsSection">
          <h3 data-i18n="backup"></h3>
          <div class="buttons">
            <button id="exportBtn" class="widebtn" data-i18n="exportJson"></button
            ><button id="importBtn" class="widebtn" data-i18n="importJson"></button>
          </div>
          <input id="importFile" class="fileInput" type="file" accept="application/json,.json" />
          <div class="hint" data-i18n="backupHint"></div>
        </div>
        <button id="saveSettings" class="widebtn primary" data-i18n="saveSettings"></button>
      </div>
      <div id="status" class="status"></div>
    </div>
    <script src="themes.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const KEY = 'overlay-controller-for-obs-v1';
      const I18N = {
        en: {
          tabNames: 'Names',
          tabSocial: 'Social',
          people: 'People',
          name: 'NAME',
          role: 'ROLE / TITLE',
          instagramOptional: 'INSTAGRAM (OPTIONAL)',
          save: 'SAVE',
          cancel: 'CANCEL',
          delete: 'DELETE',
          socialNetworks: 'Social networks',
          showSocial: 'Show social networks',
          general: 'General',
          language: 'LANGUAGE',
          duration: 'DURATION (SECONDS)',
          font: 'FONT',
          nameShadow: 'PRESENTER NAME SHADOW',
          nameLowerThird: 'Name lower third',
          primaryColor: 'PRIMARY COLOR',
          secondaryColor: 'SECONDARY COLOR',
          width: 'WIDTH (PX)',
          position: 'POSITION',
          center: 'Center',
          left: 'Left',
          right: 'Right',
          server: 'SERVER',
          port: 'PORT',
          wsHint:
            'Recommended local use: 127.0.0.1:4455. This version expects authentication disabled. Reconnection uses progressive backoff and keeps a single client session.',
          reconnect: 'RECONNECT',
          backup: 'Backup',
          exportJson: 'EXPORT JSON',
          importJson: 'IMPORT JSON',
          backupHint:
            'Exports people, social networks, appearance and connection settings. No password is used or exported.',
          saveSettings: 'SAVE SETTINGS',
          connecting: 'Connecting…',
          ready: 'Ready',
          reconnecting: 'Reconnecting…',
          authActive: 'Authentication enabled',
          authMsg:
            'Disable WebSocket authentication for this local-only setup, or configure a compatible authenticated client.',
          obsRejected: 'OBS rejected the command.',
          obsNotConnected: 'OBS is not connected.',
          onAir: 'on air.',
          socialOnAir: 'Social networks on air.',
          saved: 'Settings saved.',
          socialSaved: 'Social networks saved.',
          enterName: 'Enter a name.',
          imported: 'Configuration imported.',
          invalidJson: 'Invalid JSON.',
        },
        'pt-BR': {
          tabNames: 'Nomes',
          tabSocial: 'Redes',
          people: 'Pessoas',
          name: 'NOME',
          role: 'CARGO / FUNÇÃO',
          instagramOptional: 'INSTAGRAM (OPCIONAL)',
          save: 'SALVAR',
          cancel: 'CANCELAR',
          delete: 'EXCLUIR',
          socialNetworks: 'Redes sociais',
          showSocial: 'Mostrar redes',
          general: 'Geral',
          language: 'IDIOMA',
          duration: 'DURAÇÃO (SEGUNDOS)',
          font: 'FONTE',
          nameShadow: 'SOMBRA DO NOME DO APRESENTADOR',
          nameLowerThird: 'Lower third de nomes',
          primaryColor: 'COR PRINCIPAL',
          secondaryColor: 'COR SECUNDÁRIA',
          width: 'LARGURA (PX)',
          position: 'POSIÇÃO',
          center: 'Centro',
          left: 'Esquerda',
          right: 'Direita',
          server: 'SERVIDOR',
          port: 'PORTA',
          wsHint:
            'Uso local recomendado: 127.0.0.1:4455. Esta versão espera autenticação desativada. A reconexão usa espera progressiva e mantém apenas uma sessão cliente.',
          reconnect: 'RECONECTAR',
          backup: 'Backup',
          exportJson: 'EXPORTAR JSON',
          importJson: 'IMPORTAR JSON',
          backupHint:
            'Exporta pessoas, redes, aparência e conexão. Nenhuma senha é usada ou exportada.',
          saveSettings: 'SALVAR CONFIGURAÇÕES',
          connecting: 'Conectando…',
          ready: 'Pronto',
          reconnecting: 'Reconectando…',
          authActive: 'Autenticação ativa',
          authMsg:
            'Desative a autenticação do WebSocket para esta configuração apenas local, ou configure um cliente autenticado compatível.',
          obsRejected: 'OBS recusou o comando.',
          obsNotConnected: 'OBS não conectado.',
          onAir: 'no ar.',
          socialOnAir: 'Redes sociais no ar.',
          saved: 'Configurações salvas.',
          socialSaved: 'Redes sociais salvas.',
          enterName: 'Informe o nome.',
          imported: 'Configuração importada.',
          invalidJson: 'JSON inválido.',
        },
      };
      const DEFAULT = {
        version: '1.0.0',
        language: 'en',
        people: [{ name: 'Example', role: 'Presenter', instagram: 'example' }],
        social: { youtube: 'Your channel', facebook: 'Your page', instagram: 'yourinstagram' },
        theme: {
          duration: 30,
          font: '"Segoe UI",Arial,sans-serif',
          nameShadow: true,
          primary: '#741D2B',
          secondary: '#D6C6B4',
          nameWidth: 700,
          namePosition: 'center',
        },
        ws: { host: '127.0.0.1', port: '4455' },
      };
      function clone(x) {
        return JSON.parse(JSON.stringify(x));
      }
      function normalizePerson(p = {}) {
        return {
          name: p.name ?? p.nome ?? '',
          role: p.role ?? p.cargo ?? '',
          instagram: p.instagram ?? '',
        };
      }
      function normalizeConfig(v) {
        const out = Object.assign(clone(DEFAULT), v || {}, {
          theme: OverlayThemes.normalize(Object.assign(clone(DEFAULT.theme), v?.theme || {})),
          ws: Object.assign(clone(DEFAULT.ws), v?.ws || {}),
        });
        out.people = (v?.people || DEFAULT.people).map(normalizePerson);
        return out;
      }
      function load() {
        try {
          const v = JSON.parse(localStorage.getItem(KEY));
          return v ? normalizeConfig(v) : normalizeConfig(DEFAULT);
        } catch {
          return normalizeConfig(DEFAULT);
        }
      }
      let cfg = load(),
        ws = null,
        ready = false,
        seq = 0,
        onAir = -1,
        socialOn = false,
        editing = -1,
        retry = null,
        nameFallback = null,
        socialFallback = null,
        connectGeneration = 0,
        retryAttempt = 0,
        manualClose = false;
      function lang() {
        if (cfg.language && cfg.language !== 'auto') return cfg.language;
        return (navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt-BR' : 'en';
      }
      function t(k) {
        return (I18N[lang()] || I18N.en)[k] || I18N.en[k] || k;
      }
      function applyI18n() {
        document.documentElement.lang = lang();
        document
          .querySelectorAll('[data-i18n]')
          .forEach((el) => (el.textContent = t(el.dataset.i18n)));
        if (ready) $('connText').textContent = t('ready');
        renderSocial();
      }
      function persist() {
        localStorage.setItem(KEY, JSON.stringify(cfg));
        document.documentElement.style.setProperty('--accent', cfg.theme.primary);
      }
      function status(x, err = false) {
        $('status').textContent = x;
        $('status').classList.toggle('err', err);
      }
      function conn(state, text) {
        ready = state;
        $('dot').className = 'dot ' + (state ? 'ok' : 'bad');
        $('connText').textContent = text;
      }
      function send(o) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(o));
      }
      function req(type, data) {
        send({ op: 6, d: { requestType: type, requestId: 'ooc-' + ++seq, requestData: data } });
      }
      function emit(name, data = {}) {
        req('CallVendorRequest', {
          vendorName: 'obs-browser',
          requestType: 'emit_event',
          requestData: { event_name: name, event_data: data },
        });
      }
      function payload(data) {
        return Object.assign({}, data, { _settings: cfg.theme, _ws: cfg.ws });
      }
      function render() {
        const list = $('list');
        list.innerHTML = '';
        cfg.people.forEach((p, i) => {
          const r = document.createElement('div');
          r.className = 'row' + (onAir === i ? ' onair' : '');
          r.innerHTML = `<button class="trigger">${onAir === i ? '■' : '▶'}</button><div class="meta"><div class="name"></div><div class="sub"></div></div><button class="edit">✎</button>`;
          r.querySelector('.name').textContent = p.name;
          r.querySelector('.sub').textContent = [
            p.role,
            p.instagram ? '@' + p.instagram.replace(/^@/, '') : null,
          ]
            .filter(Boolean)
            .join(' · ');
          r.querySelector('.trigger').onclick = () => toggleName(i);
          r.querySelector('.meta').onclick = () => toggleName(i);
          r.querySelector('.edit').onclick = () => openEditor(i);
          list.appendChild(r);
        });
        renderSocial();
      }
      function finishName() {
        clearTimeout(nameFallback);
        onAir = -1;
        render();
        status(t('ready') + '.');
      }
      function finishSocial() {
        clearTimeout(socialFallback);
        socialOn = false;
        renderSocial();
        status(t('ready') + '.');
      }
      function toggleName(i) {
        if (!ready) return status(t('obsNotConnected'), true);
        if (onAir === i) {
          emit('oocLowerThirdHide');
          finishName();
          return;
        }
        emit('oocLowerThirdShow', payload(cfg.people[i]));
        onAir = i;
        render();
        status(`${cfg.people[i].name} ${t('onAir')}`);
        clearTimeout(nameFallback);
        nameFallback = setTimeout(finishName, cfg.theme.duration * 1000 + 1200);
      }
      function renderSocial() {
        $('socialCard').classList.toggle('onair', socialOn);
        $('socialTrigger').textContent = socialOn ? '■' : '▶';
        $('ytPreview').textContent = 'YouTube · ' + (cfg.social.youtube || '—');
        $('fbPreview').textContent = 'Facebook · ' + (cfg.social.facebook || '—');
        $('igPreview').textContent =
          'Instagram · ' +
          (cfg.social.instagram ? '@' + cfg.social.instagram.replace(/^@/, '') : '—');
      }
      function toggleSocial() {
        if (!ready) return status(t('obsNotConnected'), true);
        if (socialOn) {
          emit('oocSocialHide');
          finishSocial();
          return;
        }
        emit('oocSocialShow', payload(cfg.social));
        socialOn = true;
        renderSocial();
        status(t('socialOnAir'));
        clearTimeout(socialFallback);
        socialFallback = setTimeout(finishSocial, cfg.theme.duration * 1000 + 1800);
      }
      function schedule(gen) {
        if (gen !== connectGeneration || manualClose || ready) return;
        clearTimeout(retry);
        const delay = Math.min(30000, 2000 * Math.pow(2, Math.min(retryAttempt, 4)));
        retryAttempt++;
        retry = setTimeout(() => connect(false), delay);
      }
      function connect(userInitiated = false) {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING))
          return;
        if (userInitiated) {
          retryAttempt = 0;
          clearTimeout(retry);
        }
        const gen = ++connectGeneration;
        manualClose = false;
        conn(false, t('connecting'));
        let socket;
        try {
          socket = new WebSocket(`ws://${cfg.ws.host}:${cfg.ws.port}`, 'obswebsocket.json');
        } catch {
          schedule(gen);
          return;
        }
        ws = socket;
        socket.onmessage = (e) => {
          if (gen !== connectGeneration) return;
          let m;
          try {
            m = JSON.parse(e.data);
          } catch {
            return;
          }
          if (m.op === 0) {
            if (m.d.authentication) {
              conn(false, t('authActive'));
              status(t('authMsg'), true);
              manualClose = true;
              try {
                socket.close();
              } catch {}
              return;
            }
            socket.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, eventSubscriptions: 0 } }));
          } else if (m.op === 2) {
            retryAttempt = 0;
            conn(true, t('ready'));
            status(t('ready') + '.');
          } else if (m.op === 7 && !m.d.requestStatus.result) status(t('obsRejected'), true);
        };
        socket.onclose = () => {
          if (gen !== connectGeneration) return;
          ready = false;
          ws = null;
          if (manualClose) return;
          conn(false, t('reconnecting'));
          schedule(gen);
        };
        socket.onerror = () => {};
      }
      function restartConnection() {
        manualClose = true;
        clearTimeout(retry);
        connectGeneration++;
        const old = ws;
        ws = null;
        ready = false;
        if (old) {
          try {
            old.onclose = null;
            old.close();
          } catch {}
        }
        manualClose = false;
        retryAttempt = 0;
        connect(true);
      }
      function openEditor(i) {
        editing = i;
        $('editor').classList.add('open');
        const p = i >= 0 ? cfg.people[i] : { name: '', role: '', instagram: '' };
        $('personName').value = p.name;
        $('personRole').value = p.role;
        $('instagramPessoa').value = p.instagram;
        $('delete').style.display = i >= 0 ? 'block' : 'none';
      }
      $('add').onclick = () => openEditor(-1);
      $('cancel').onclick = () => $('editor').classList.remove('open');
      $('save').onclick = () => {
        const p = {
          name: $('personName').value.trim(),
          role: $('personRole').value.trim(),
          instagram: $('instagramPessoa').value.trim().replace(/^@/, ''),
        };
        if (!p.name) return status(t('enterName'), true);
        if (editing >= 0) cfg.people[editing] = p;
        else cfg.people.push(p);
        persist();
        $('editor').classList.remove('open');
        render();
      };
      $('delete').onclick = () => {
        if (editing < 0) return;
        cfg.people.splice(editing, 1);
        persist();
        $('editor').classList.remove('open');
        finishName();
      };
      $('socialTrigger').onclick = toggleSocial;
      $('socialEdit').onclick = () => {
        $('socialEditor').classList.add('open');
        $('youtube').value = cfg.social.youtube;
        $('facebook').value = cfg.social.facebook;
        $('instagramSocial').value = cfg.social.instagram;
      };
      $('cancelSocial').onclick = () => $('socialEditor').classList.remove('open');
      $('saveSocial').onclick = () => {
        cfg.social = {
          youtube: $('youtube').value.trim(),
          facebook: $('facebook').value.trim(),
          instagram: $('instagramSocial').value.trim().replace(/^@/, ''),
        };
        persist();
        $('socialEditor').classList.remove('open');
        renderSocial();
        status(t('socialSaved'));
      };
      function fillSettings() {
        $('language').value = cfg.language || 'auto';
        $('duration').value = cfg.theme.duration;
        $('font').value = cfg.theme.font;
        if (!$('font').value) $('font').value = '"Segoe UI",Arial,sans-serif';
        $('nameShadow').checked = cfg.theme.nameShadow !== false;
        $('primaryColor').value = cfg.theme.primary;
        $('primaryColorPicker').value = cfg.theme.primary;
        $('secondaryColor').value = cfg.theme.secondary;
        $('secondaryColorPicker').value = cfg.theme.secondary;
        $('nameWidth').value = cfg.theme.nameWidth;
        $('namePosition').value = cfg.theme.namePosition;
        $('host').value = cfg.ws.host;
        $('port').value = cfg.ws.port;
      }
      function syncColor(a, b) {
        $(a).oninput = () => ($(b).value = $(a).value);
        $(b).oninput = () => ($(a).value = $(b).value);
      }
      syncColor('primaryColor', 'primaryColorPicker');
      syncColor('secondaryColor', 'secondaryColorPicker');
      $('language').onchange = () => {
        cfg.language = $('language').value;
        persist();
        applyI18n();
      };
      $('saveSettings').onclick = () => {
        cfg.language = $('language').value;
        cfg.theme.duration = Math.max(3, Math.min(300, Number($('duration').value) || 30));
        cfg.theme.font = $('font').value;
        cfg.theme.nameShadow = $('nameShadow').checked;
        cfg.theme.primary = $('primaryColor').value || '#741D2B';
        cfg.theme.secondary = $('secondaryColor').value || '#D6C6B4';
        cfg.theme.nameWidth = Math.max(420, Math.min(1200, Number($('nameWidth').value) || 700));
        cfg.theme.namePosition = $('namePosition').value;
        const changed =
          cfg.ws.host !== ($('host').value.trim() || '127.0.0.1') ||
          cfg.ws.port !== ($('port').value.trim() || '4455');
        cfg.ws.host = $('host').value.trim() || '127.0.0.1';
        cfg.ws.port = $('port').value.trim() || '4455';
        cfg.theme = OverlayThemes.normalize(cfg.theme);
        persist();
        applyI18n();
        status(t('saved'));
        if (changed) restartConnection();
      };
      $('reconnect').onclick = restartConnection;
      $('exportBtn').onclick = () => {
        const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' }),
          a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'overlay-controller-for-obs-config.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      $('importBtn').onclick = () => $('importFile').click();
      $('importFile').onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          const x = JSON.parse(await f.text());
          if (!x.people || !x.social || !x.theme) throw 0;
          cfg = normalizeConfig(x);
          persist();
          fillSettings();
          applyI18n();
          render();
          status(t('imported'));
          restartConnection();
        } catch {
          status(t('invalidJson'), true);
        }
        e.target.value = '';
      };
      document.querySelectorAll('.tab').forEach(
        (b) =>
          (b.onclick = () => {
            document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === b));
            document
              .querySelectorAll('.view')
              .forEach((v) => v.classList.toggle('active', v.id === b.dataset.tab));
          }),
      );
      persist();
      fillSettings();
      applyI18n();
      render();
      connect(true);
    </script>
    <script src="theme-editor.js"></script>
    <script src="settings-modules.js"></script>
  </body>
</html>
